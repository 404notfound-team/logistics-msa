server:
  port: 8080
springdoc:
  api-docs:
    enabled: false
  paths-to-match:
    - /api/orders/**
spring:
  application:
    name: orders
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_db?currentSchema=orders}
    username: orders_app
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    loadbalancer:
      eager-load:
        clients: company,hub,delivery
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${orders.clients.connect-timeout-ms}
            read-timeout: ${orders.clients.read-timeout-ms}
            follow-redirects: false
          infraHubProbe:
            connect-timeout: 2000
            read-timeout: 5000
            follow-redirects: true
      micrometer:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
slack:
  enabled: ${SLACK_ENABLED:false}
  webhook-url: "${SLACK_WEBHOOK_URL:}"

orders:
  jwt:
    secret: "${JWT_SECRET:}"
  clients:
    connect-timeout-ms: ${ORDERS_CLIENTS_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ORDERS_CLIENTS_READ_TIMEOUT_MS:2000}
    company-url: "${ORDERS_COMPANY_URL:}"
    stock-url: "${ORDERS_STOCK_URL:}"
    delivery-url: "${ORDERS_DELIVERY_URL:}"
    users-url: "${ORDERS_USERS_URL:}"
    service-token: "${ORDERS_SERVICE_TOKEN:}"
  recovery:
    enabled: ${ORDERS_RECOVERY_ENABLED:true}
    delay-ms: ${ORDERS_RECOVERY_DELAY_MS:5000}

springdoc:
  api-docs:
    enabled: true
spring:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations:
        - classpath:db/seed/data.sql
        - classpath:db/seed/hub-routes.sql
        - classpath:db/seed/local-stocks.sql

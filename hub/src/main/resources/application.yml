server:
  port: 8080
hub:
  jwt:
    secret: ${JWT_SECRET:}
  clients:
    company-url: ${COMPANY_URL:}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  internal-auth:
    service-token: ${HUB_SERVICE_TOKEN:}
    clients:
      orders:
        token: ${ORDERS_SERVICE_TOKEN:}
        allowed:
          - GET /internal/hubs/*/stocks/*
          - POST /internal/stocks/deductions
          - POST /internal/stocks/restorations
      users:
        token: ${USERS_SERVICE_TOKEN:}
        allowed:
          - GET /internal/hubs
          - GET /internal/hubs/*
      company:
        token: ${COMPANY_SERVICE_TOKEN:}
        allowed:
          - GET /internal/hubs/*
      delivery:
        token: ${DELIVERY_SERVICE_TOKEN:}
        allowed:
          - GET /internal/hubs/*
          - GET /internal/hub-routes
springdoc:
  api-docs:
    enabled: false
  paths-to-match:
    - /api/hubs/**
    - /api/hub-routes/**
    - /api/stocks/**
    - /api/products/*/stocks
spring:
  application:
    name: hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hub_db?currentSchema=hub}
    username: hub_app
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hub
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
          hubProducts:
            connect-timeout: ${hub.clients.connect-timeout-ms}
            read-timeout: ${hub.clients.read-timeout-ms}
            follow-redirects: false
      micrometer:
        enabled: true


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

server:
  port: 8080
springdoc:
  api-docs:
    enabled: false
  paths-to-match:
    - /api/users/**
users:
  audit:
    # Anonymous signup has no authenticated username yet; this is its designated audit actor.
    signup-actor: signup-service
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  internal-auth:
    # Users가 다른 서비스의 내부 API를 호출할 때 보내는 X-Service-Token 값입니다.
    service-token: ${USERS_SERVICE_TOKEN}
    # 설정된 경우 Orders의 알림용 이름 조회만 허용합니다.
    orders-token: ${ORDERS_SERVICE_TOKEN:}
    # Delivery의 담당자 배정 시 현재 계정 확인만 허용합니다.
    delivery-token: ${DELIVERY_SERVICE_TOKEN:}
    # Users 내부 API를 호출할 수 있는 서비스와 허용 API입니다.
    clients:
      gateway:
        token: ${GATEWAY_SERVICE_TOKEN}
        allowed:
          - GET /internal/users/*/authorization
spring:
  application:
    name: users
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users_db?currentSchema=users}
    username: users_app
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: users
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
      micrometer:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

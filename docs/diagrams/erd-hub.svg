<title id="title">허브 도메인 ERD</title>
<desc id="desc">hub_db의 hub 스키마 엔티티 기준. 주문별 차감 성공·확정 거절과 복원 기록을 보관한다. 차감 거절은 재고 참조가 없으므로 재고 관계는 선택적이다. 감사 컬럼 6개는 생략하고 모든 관계는 논리 참조다.</desc>

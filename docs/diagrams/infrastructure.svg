    <text x="588" y="492" class="meta" text-anchor="end">UI · localhost:9411</text>
  </g>
  <g id="external-slack" data-external="true">
    <rect x="656" y="448" width="272" height="56" rx="6" fill="#fff" stroke="#c5ccd5"/>
    <use href="#icon-slack" x="672" y="456" width="40" height="40"/>
    <text x="726" y="470" font-size="14" font-weight="600">Slack 알림</text>
    <text x="726" y="492" class="meta">외부 서비스 · 주문 확정 알림</text>
  </g>
  <text x="128" y="538" class="meta">서비스별 독립 스키마 · PostgreSQL 컨테이너·볼륨은 공유</text>
</svg>

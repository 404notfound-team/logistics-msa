  <text x="612" y="238" class="meta" text-anchor="middle">서비스 간 통신 · Feign / HTTP · 서비스 간 인증</text>
  <text x="316" y="384" font-size="12" font-weight="600">PostgreSQL 18 · 컨테이너 1개</text>
  <text x="908" y="384" class="meta" text-anchor="end">독립 스키마</text>
  <g id="monitoring-zipkin" data-runtime="zipkin" data-port="9411">

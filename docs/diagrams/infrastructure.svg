    <text x="724" y="208" class="name">주문</text>
  </g>
  <g id="db-orders" data-database="orders_db" data-schema="orders" data-owner-service="orders">
    <use href="#icon-db" x="704" y="304" width="40" height="40"/>
    <text x="724" y="360" class="db-name">orders_db</text>
  </g>
  <g id="service-delivery" data-database="delivery_db" data-schema="delivery">

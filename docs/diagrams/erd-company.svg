<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1272" height="276" viewBox="0 0 1272 276" role="img" aria-labelledby="title desc">
<title id="title">업체 도메인 ERD</title>
<desc id="desc">현재 company_db의 company 스키마 엔티티 기준. 감사 컬럼 6개는 생략한다. 서비스 간 참조는 UUID 논리 참조다. NULL 허용은 물음표, UK*는 복합 또는 조건부 유일 제약이다. 컬럼의 참조·조건 메모를 함께 읽는다.</desc>

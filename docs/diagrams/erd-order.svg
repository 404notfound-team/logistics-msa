</g>
<line x1="16" y1="608" x2="576" y2="608" stroke="#d7e1e9"/>
<text x="16" y="628" class="field-note">PK 주키 · UK 유일 · UK* 복합/부분 유일 · ? NULL 허용 · — 필수</text>
<text x="16" y="646" class="field-note">점선은 논리 참조 · 물리 FK 없음 · 감사 컬럼 6개 생략</text>
<text x="16" y="664" class="field-note">재고 계약 버전 2인 신규 주문만 차감 재시도 허용 · 기존 주문 버전은 NULL 유지</text>
<text x="16" y="682" class="field-note">복구 단계·실패 횟수·자동 중단 여부는 재시작 후에도 유지</text>
<text x="16" y="700" class="field-note">재시도 소진·영구 오류는 RECOVERY_REQUIRED 유지 · 자동으로 FAILED 확정하지 않음</text>
</svg>

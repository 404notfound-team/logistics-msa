<g data-field="recipient_name" data-type="VARCHAR(100)" data-nullable="false" data-key="" data-note="최초값 고정"><text x="30" y="385" class="key"></text><text x="60" y="385" class="field-name">recipient_name</text><text x="280" y="385" class="field-type">VARCHAR(100)</text><text x="408" y="385" class="field-note">—</text><text x="438" y="385" class="field-note">최초값 고정</text></g>
<g data-field="status" data-type="VARCHAR(32)" data-nullable="false" data-key="" data-note=""><rect x="17" y="392" width="558" height="24" fill="#fafbfd"/><text x="30" y="409" class="key"></text><text x="60" y="409" class="field-name">status</text><text x="280" y="409" class="field-type">VARCHAR(32)</text><text x="408" y="409" class="field-note">—</text><text x="438" y="409" class="field-note"></text></g>
<g data-field="last_error" data-type="VARCHAR(255)" data-nullable="true" data-key="" data-note="최근 오류 사유"><text x="30" y="433" class="key"></text><text x="60" y="433" class="field-name">last_error</text><text x="280" y="433" class="field-type">VARCHAR(255)</text><text x="408" y="433" class="field-note">?</text><text x="438" y="433" class="field-note">최근 오류 사유</text></g>
<g data-field="idempotency_key" data-type="UUID" data-nullable="false" data-key="UK*" data-note="created_by와 복합"><rect x="17" y="440" width="558" height="24" fill="#fafbfd"/><text x="30" y="457" class="key">UK*</text><text x="60" y="457" class="field-name">idempotency_key</text><text x="280" y="457" class="field-type">UUID</text><text x="408" y="457" class="field-note">—</text><text x="438" y="457" class="field-note">created_by와 복합</text></g>

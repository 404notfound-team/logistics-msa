<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="592" height="716" viewBox="0 0 592 716" role="img" aria-labelledby="title desc">
<title id="title">주문 도메인 ERD</title>
<desc id="desc">orders_db의 orders 스키마 엔티티 기준. 기존 주문 스냅샷과 재고 계약 버전·복구 단계·실패 횟수·자동 복구 중단 여부를 표시한다. 감사 컬럼 6개는 생략하고 서비스 간 참조는 UUID 논리 참조다.</desc>
<defs><style>text{font-family:'Apple SD Gothic Neo',Arial,sans-serif;fill:#2c3947}.entity-name{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:600;fill:#2e5574}.column-head{font-size:10px;font-weight:600;fill:#768492}.field-name{font-family:Menlo,Consolas,monospace;font-size:11px}.field-type{font-family:Menlo,Consolas,monospace;font-size:10px;fill:#697886}.field-note{font-size:10px;fill:#697886}.key{font-size:8px;font-weight:700;fill:#326485}.relation{fill:none;stroke:#7190a6;stroke-width:1.25;stroke-dasharray:4 4;stroke-linecap:round}.physical{stroke-dasharray:none}.cardinality{font-size:10px;fill:#4b6b83}.relation-label{font-size:11px;fill:#556d80}</style></defs>
<rect width="592" height="716" fill="#fff"/>
<g id="entity-p_orders" data-entity="orders.p_orders">
<rect x="16" y="16" width="560" height="568" rx="6" fill="#fff" stroke="#c8d3dd"/>

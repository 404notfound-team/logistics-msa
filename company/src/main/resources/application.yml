server:
  port: 8080
company:
  jwt:
    # users가 발급하는 JWT를 검증하는 HS256 키. 비어 있으면 모든 /api/** 요청을 401로 거부한다.
    secret: "${JWT_SECRET:}"
  security:
    internal:
      # 내부 API를 호출하는 서비스의 X-Service-Token. 비어 있으면 그 서비스의 호출을 401로 거부한다.
      orders-token: "${ORDERS_SERVICE_TOKEN:}"
      users-token: "${USERS_SERVICE_TOKEN:}"
  clients:
    # 비어 있으면 Eureka에서 hub를 찾는다.
    hub-url: "${COMPANY_HUB_URL:}"
    # hub 내부 API를 호출할 때 보내는 company의 X-Service-Token.
    service-token: "${COMPANY_SERVICE_TOKEN:}"
springdoc:
  api-docs:
    enabled: false
  paths-to-match:
    - /api/companies/**
    - /api/products/**
spring:
  application:
    name: company
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company_db?currentSchema=company}
    username: company_app
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: company
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
      micrometer:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

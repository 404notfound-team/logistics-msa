name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon clean build
      - name: Configure local environment
        run: bash scripts/init-env.sh
      - name: Start infrastructure
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify service boundaries and tracing
        run: python3 scripts/smoke.py
      - name: Show service status on failure
        if: failure()
        run: docker compose ps -a
      - name: Clean up CI resources
        if: always()
        run: docker compose down -v --remove-orphans

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check formatting, lint, compile and test
        run: ./gradlew --no-daemon --parallel --build-cache --continue check
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-reports
          path: |
            **/build/reports/checkstyle/
            **/build/reports/tests/
            **/build/test-results/test/*.xml
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_FILE: compose.yml:compose.ci.yml
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure local environment
        id: configure-env
        run: bash scripts/init-env.sh
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Package applications and prepare Docker
        run: |
          (
            docker compose up -d postgres zipkin &&
              docker build --target runtime-base .
          ) &
          docker_pid=$!
          status=0
          ./gradlew --no-daemon --parallel --build-cache bootJar || status=$?
          wait "$docker_pid" || status=$?
          exit "$status"
      - name: Prepare CI image context
        run: |
          for jar in */build/libs/app.jar; do
            module="${jar%%/*}"
            mkdir -p "work/ci-jars/$module"
            cp "$jar" "work/ci-jars/$module/app.jar"
          done
      - name: Start infrastructure
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify service boundaries and tracing
        run: python3 scripts/smoke.py
      - name: Show service status on failure
        if: failure() && steps.configure-env.outcome == 'success'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Clean up CI resources
        if: always() && steps.configure-env.outcome == 'success'
        run: docker compose down -v --remove-orphans

  build-and-smoke:
    if: always()
    needs: [quality, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all verification jobs to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$SMOKE_RESULT" = success
